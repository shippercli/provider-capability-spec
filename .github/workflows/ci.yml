name: Content CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Markdown content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate document structure and links
        shell: bash
        run: |
          ruby <<'RUBY'
          errors = []
          files = Dir.glob('**/*.md').sort
          errors << 'repository has no Markdown content' if files.empty?

          files.each do |path|
            content = File.read(path)
            errors << "#{path}: missing H1 title" unless content.lines.any? { |line| line.start_with?('# ') }

            content.scan(/!?\[[^\]]*\]\(([^)\s]+)(?:\s+[^)]*)?\)/).flatten.each do |link|
              next if link.start_with?('#', '/', 'http://', 'https://', 'mailto:')

              target = link.split('#', 2).first
              next if target.empty?

              resolved = File.expand_path(target, File.dirname(path))
              candidates = [resolved, "#{resolved}.md", File.join(resolved, 'README.md')]
              errors << "#{path}: unresolved local link #{link}" unless candidates.any? { |candidate| File.file?(candidate) }
            end
          end

          abort(errors.join("\n")) unless errors.empty?
          RUBY
